services:
  claudegram:
    build: .
    image: claudegram:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CLAUDEGRAM_STATE_DIR: /data
    volumes:
      - estado:/data
    # El bot solo hace llamadas salientes: no publica ningún puerto.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  estado:
